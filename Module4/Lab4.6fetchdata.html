<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONPlaceholder Posts - Bootstrap Grid</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <h1 class="text-center mb-4">JSONPlaceholder Posts</h1>
    <div id="loading" class="text-center text-muted mb-3">Loading posts...</div>
    <div id="error" class="text-center text-danger fw-bold"></div>
    <div id="posts" class="row g-4"></div>
</div>

<!-- Bootstrap JS (optional for components) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const postsContainer = document.getElementById('posts');
    const loadingIndicator = document.getElementById('loading');
    const errorContainer = document.getElementById('error');

    async function fetchPosts() {
        try {
            const response = await fetch('https://jsonplaceholder.typicode.com/posts');

            if (!response.ok) {
                throw new Error(`HTTP error! Status: ${response.status}`);
            }

            const posts = await response.json();

            // Limit to first 10 posts
            const limitedPosts = posts.slice(0, 10);

            loadingIndicator.style.display = 'none';

            limitedPosts.forEach(post => {
                const col = document.createElement('div');
                col.className = 'col-sm-6 col-md-4 col-lg-3'; // Responsive grid

                col.innerHTML = `
                    <div class="card h-100 shadow-sm">
                        <div class="card-body">
                            <h5 class="card-title text-primary">${post.title}</h5>
                            <p class="card-text">${post.body}</p>
                        </div>
                        <div class="card-footer text-muted small">
                            Post ID: ${post.id}
                        </div>
                    </div>
                `;
                postsContainer.appendChild(col);
            });

        } catch (error) {
            loadingIndicator.style.display = 'none';
            errorContainer.textContent = `Failed to load posts: ${error.message}`;
        }
    }

    fetchPosts();
</script>

</body>
</html>
